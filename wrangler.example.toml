name = "radar-gear"
main = "dist/server/index.js"
compatibility_date = "2026-05-01"
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "radar-gear"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

[vars]
RADAR_IDENTITY_MODE = "cloudflare-access"
RADAR_ACCESS_TEAM_DOMAIN = "equipe-exemplo.cloudflareaccess.com"
RADAR_ACCESS_AUD = "audiencia-ficticia-do-aplicativo"
